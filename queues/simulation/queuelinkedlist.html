<!doctype html>
<html lang="en">
  <head>
    <title>Queues Practice</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/stacks-and-queues.css" />
    <link
      rel="stylesheet"
      href="../../assets/css/common-styles-responsive.css"
    />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.0/jquery.min.js"></script>
  </head>
  <body>
    <div class="instruction-box">
      <button class="collapsible">Instructions</button>
      <div class="content">
        <ul>
          <li>
            Enter a value and click <b>Enqueue</b> to add it to the rear of the
            queue.
          </li>
          <li>
            Click <b>Dequeue</b> to remove the front element from the queue.
          </li>
          <li>Click <b>Clear</b> to reset the queue.</li>
        </ul>
      </div>
    </div>

    <canvas id="linkedlist" width="1200" height="330">
      Your browser does not support canvas.
    </canvas>

    <div class="comment-box" id="comments-qll">
      <b>Observations</b><br />
      <p id="ins"></p>
    </div>
    <div class="buttons-wrapper">
      <input
        class="text-box"
        id="HeadtoBeInserted"
        type="alphanumeric"
        autocomplete="off"
        class="leftinput"
        placeholder="Enter an element"
        maxlength="3"
      />
      <input
        type="button"
        class="button-input"
        value="Enqueue"
        id="enqueue-button-qll"
      />
      <input
        type="button"
        class="button-input"
        value="Dequeue"
        id="dequeue-button-qll"
      />
      <input
        type="button"
        class="button-input"
        value="Clear"
        id="clear-button"
      />
    </div>

    <script src="js/queue-linkedlist.js"></script>
    <script src="../../assets/js/instruction-box.js"></script>
  <script src="../../assets/js/iframeResize.js"></script>
        
        </body>
</html>
